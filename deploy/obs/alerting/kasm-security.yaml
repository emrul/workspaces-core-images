apiVersion: 1

# Security alert rules for Kasm session monitoring.
#
# NOTE ON ROUTING: these deliberately use the default contact point. Where alert
# notifications go is still an open decision, and an annotation carrying session
# identifiers exports them to a third party with its own retention and access
# model (see the design doc, section 6). Until that is settled, alerts are
# visible in Grafana and go no further.

groups:
  - orgId: 1
    name: kasm-security
    folder: Kasm
    interval: 1m
    rules:
      - uid: kasm-userns-unexpected
        title: Unexpected user-namespace creation in a Kasm session
        condition: THRESHOLD
        # No data means no userns events at all, which is the normal state.
        noDataState: OK
        # A broken query must not look like "all clear".
        execErrState: Alerting
        for: 0m
        annotations:
          summary: >-
            A non-browser binary created a user namespace inside a Kasm session.
          description: >-
            Nothing on these nodes mediates user-namespace creation: seccomp does
            not block unshare(CLONE_NEWUSER) and there is no AppArmor. A user
            namespace gives the tenant root within it, which is the usual first
            step toward kernel privilege escalation.

            Browsers legitimately create namespaces for their own sandboxes and
            are excluded below; anything else is a tenant doing it deliberately.
            The return value does not change the severity - a failed attempt is
            still an attempt.

            Investigate: identify the session from the pod name, then join id12
            to Kasm's session records to reach the account.
          runbook: design/tetragon-session-monitoring.md section 4
        labels:
          severity: high
          area: kasm-session
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: loki
            model:
              refId: A
              datasource: {type: loki, uid: loki}
              queryType: instant
              # Match the trailing path component, never the Nix store hash -
              # that changes on every package update and would silently turn
              # this alert into a firehose.
              expr: >-
                sum(count_over_time({cluster="civo-phx1"} |= "create_user_ns"
                  | json fn="process_kprobe.function_name", binary="process_kprobe.process.binary"
                  | fn = "create_user_ns"
                  | binary !~ ".*/bwrap(\\.real)?"
                  | binary !~ ".*/lib/firefox/firefox"
                  | binary !~ ".*/\\.firefox-wrapped"
                  | binary !~ ".*/libexec/chromium/chromium"
                  | binary !~ ".*/chrome-sandbox"
                  [5m]))
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      - uid: kasm-runtime-socket
        title: Container-runtime socket connect from a Kasm session
        condition: THRESHOLD
        noDataState: OK
        execErrState: Alerting
        for: 0m
        annotations:
          summary: >-
            A Kasm session attempted to connect to a container-runtime socket.
          description: >-
            There is no legitimate reason for a workspace to talk to the CRI or
            Docker socket. Treat as an attempted container escape.

            The event fires when the request reaches the LSM hook, which happens
            before path resolution - so this alerts even when the connect itself
            returns ENOENT because the socket is not mounted into the pod. That
            is still a deliberate attempt and is still worth investigating.
          runbook: design/tetragon-session-monitoring.md section 4
        labels:
          severity: critical
          area: kasm-session
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: loki
            model:
              refId: A
              datasource: {type: loki, uid: loki}
              queryType: instant
              expr: >-
                sum(count_over_time({cluster="civo-phx1"}
                  |= "kasm-observe-runtime-sockets" [5m]))
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      - uid: kasm-bpf-perf-module
        title: BPF, perf or kernel-module surface reached from a Kasm session
        condition: THRESHOLD
        noDataState: OK
        execErrState: Alerting
        for: 0m
        annotations:
          summary: >-
            A Kasm session reached a kernel subsystem that seccomp should have
            rejected first.
          description: >-
            Seccomp rejects these calls before the hook, so a correctly confined
            session produces no event here at all. A hit therefore means the
            applied seccomp profile is not what we think it is - investigate the
            profile before investigating the session.
          runbook: design/tetragon-session-monitoring.md section 4
        labels:
          severity: high
          area: kasm-session
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: loki
            model:
              refId: A
              datasource: {type: loki, uid: loki}
              queryType: instant
              expr: >-
                sum(count_over_time({cluster="civo-phx1"}
                  |~ "kasm-observe-(bpf-perf|modules)" [5m]))
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      - uid: kasm-foreign-binary
        title: User-supplied binary executed in a Kasm session
        condition: THRESHOLD
        noDataState: OK
        execErrState: Alerting
        for: 0m
        annotations:
          summary: >-
            A binary was executed from a writable path inside a Kasm session -
            it did not ship in the image.
          description: >-
            Everything we ship runs from /usr, /nix, /store or /dockerstartup. A
            binary running from /tmp, /home, /dev/shm or /var/tmp was put there
            by whoever is using the session.

            Measured baseline: 828 execs in 90 minutes of normal use, 8 outside
            shipped paths, all explainable. This should be quiet.

            BLIND SPOT - do not read a silent alert as "nothing was run". This
            catches downloaded ELF binaries only. An interpreted payload
            (python3 /tmp/x.py, sh /tmp/x.sh, curl | bash) execs an allowlisted
            interpreter and is invisible here, because the payload lives in argv
            which is deliberately not collected.
          runbook: design/tetragon-session-monitoring.md section 4
        labels:
          severity: high
          area: kasm-session
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: loki
            model:
              refId: A
              datasource: {type: loki, uid: loki}
              queryType: instant
              # Known-benign exclusions are here rather than in the policy, so
              # the events stay in the record for forensics even when they do
              # not page: our own StaticX-packed printer service, and the Go
              # re-exec pattern (which is also the runc CVE-2019-5736 primitive,
              # so it is excluded reluctantly - revisit if it ever correlates).
              expr: >-
                sum(count_over_time({cluster="civo-phx1"}
                  |= "kasm-observe-foreign-binary"
                  | json path="process_kprobe.args[0].linux_binprm_arg.path"
                  | path !~ "/tmp/staticx-[A-Za-z0-9]+/.*"
                  | path != "/proc/self/exe"
                  [5m]))
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      - uid: kasm-unusual-egress
        title: Outbound connection from a Kasm session on an unusual port
        condition: THRESHOLD
        noDataState: OK
        execErrState: Alerting
        for: 0m
        annotations:
          summary: >-
            A session connected out to an external address on a port that is not
            web, DNS or NTP.
          description: >-
            This is the primary abuse signal for shared hosting. Mining pools
            (3333/4444/5555/7777/8888/9999/14444/45700), reverse shells, SMTP
            relay (25/465/587) and port scanning all leave this way, and none of
            them are caught by containment controls because nothing escapes the
            container. It is also what gets our address ranges blocklisted.

            Verified live: ports 3333 and 25 alert, 443 does not.

            Triage: look at the destination port and the binary. A single
            connection may be benign; a repeated pattern to one endpoint, or any
            connection from a binary that also tripped the user-supplied-binary
            rule, is not.
          runbook: design/tetragon-session-monitoring.md section 4
        labels:
          severity: high
          area: kasm-session
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: loki
            model:
              refId: A
              datasource: {type: loki, uid: loki}
              queryType: instant
              expr: >-
                sum(count_over_time({cluster="civo-phx1"}
                  |= "kasm-observe-egress" [5m]))
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      - uid: kasm-privilege-escalation
        title: Privilege-escalation binary run outside the boot chain
        condition: THRESHOLD
        noDataState: OK
        execErrState: Alerting
        for: 0m
        annotations:
          summary: >-
            su/sudo/pkexec/doas was executed by something other than Kasm's own
            startup machinery.
          description: >-
            Measured baseline: /usr/bin/su runs 21 times in a normal session and
            EVERY one is our own boot chain - kasm-setup, nix-activate, timeout
            or runc - dropping privilege, not raising it. sudo is not installed
            at all. So the parent binary is the discriminator, and anything
            outside that set is a tenant escalating deliberately.

            DO NOT rewrite this rule against process uid. Tetragon reports
            nonsense uid values for some session processes (176553984,
            2368929792 and similar were observed), so uid is not trustworthy
            here. Parent binary is.
          runbook: design/tetragon-session-monitoring.md section 4
        labels:
          severity: high
          area: kasm-session
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: loki
            model:
              refId: A
              datasource: {type: loki, uid: loki}
              queryType: instant
              expr: >-
                sum(count_over_time({cluster="civo-phx1"}
                  | json binary="process_exec.process.binary", parent="process_exec.parent.binary"
                  | binary =~ ".*/(su|sudo|pkexec|doas)"
                  | parent !~ ".*/(kasm-setup|nix-activate|timeout|runc|container-init)"
                  [5m]))
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}

      - uid: kasm-miner-binary
        title: Known cryptominer binary name executed in a Kasm session
        condition: THRESHOLD
        noDataState: OK
        execErrState: Alerting
        for: 0m
        annotations:
          summary: A process matching a known miner name ran in a session.
          description: >-
            Cheap supplementary signal only - it costs nothing because these are
            existing exec events, and it catches the lazy case where someone runs
            xmrig without renaming it.

            TRIVIALLY EVADED by renaming the binary. The rules that actually
            carry the weight here are the user-supplied-binary rule (catches a
            downloaded miner whatever it is called) and the unusual-egress rule
            (catches the stratum connection). Treat this as a bonus, never as
            the control.
          runbook: design/tetragon-session-monitoring.md section 4
        labels:
          severity: high
          area: kasm-session
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: loki
            model:
              refId: A
              datasource: {type: loki, uid: loki}
              queryType: instant
              expr: >-
                sum(count_over_time({cluster="civo-phx1"}
                  | json binary="process_exec.process.binary"
                  | binary =~ "(?i).*/(xmrig|minerd|cpuminer|ethminer|t-rex|nbminer|phoenixminer|lolminer|xmr-stak|cgminer|bfgminer|ccminer|nheqminer|srbminer|teamredminer|kryptex)([-_.].*)?"
                  [5m]))
          - refId: THRESHOLD
            datasourceUid: __expr__
            model:
              refId: THRESHOLD
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
