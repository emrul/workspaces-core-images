apiVersion: 1

# The first provisioning pass created these without explicit uids. Re-declaring
# them WITH a uid fails ("data source not found") unless the old records are
# removed first, and that failure is fatal - Grafana refuses to start.
deleteDatasources:
  - name: Loki
    orgId: 1
  - name: Prometheus
    orgId: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
