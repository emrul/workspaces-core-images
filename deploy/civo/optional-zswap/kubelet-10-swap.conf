# /etc/rancher/k3s/kubelet.conf.d/10-swap.conf  (on every session node)
#
# THIS FILE IS THE WHOLE POINT. With only the kubelet flags
# (fail-swap-on=false, feature-gates=NodeSwap=true) this k3s build still defaults
# to NoSwap, and a Burstable pod gets memory.swap.max=0 — the entire swap+zswap
# stack is then inert with no error anywhere. Measured 2026-08-06; the KEP's
# "gate on implies LimitedSwap" does not hold here.
#
# LimitedSwap grants each Burstable pod:
#     pod_swap_max = (container_memory_request / node_total_memory) x node_swap
# Verified: 256Mi request -> 85.7 MiB; 2.5Gi request -> 856 MiB on 10 GB host swap.
# Guaranteed and BestEffort pods get zero, so a session with no memory request
# gets no swap no matter what is configured here.
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
memorySwap:
  swapBehavior: LimitedSwap
