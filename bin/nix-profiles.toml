# Default profile set for build-nix-store-volume.
#
# See design/nix-package-process.md for the design and update-cadence
# policy. In short:
#   - [nixpkgs].ref pins the *base* layer; bump at nixpkgs stable
#     release boundaries (~6 months).
#   - Profiles that need a faster cadence override `ref` to a rolling
#     branch. Their delta layer grows (carries its own libs) but the
#     base layer's digest stays stable across their bumps.

[nixpkgs]
# PINNED to a specific rev (not the floating nixos-25.05 branch) so builds are
# reproducible AND the bin/nix-gpu-overlay flake (which must use the SAME rev for
# its trimmed VirtualGL deps to dedup / avoid a second glibc) stays aligned.
# Bump this and bin/nix-gpu-overlay/flake.{nix,lock} together. See
# design/nix-dedup-gap.md.
ref = "github:NixOS/nixpkgs/d407951447dcd00442e97087bf374aad70c04cea"

# Packages that go in the base OCI layer. The build script also includes
# the closures of these packages — glibc pulls in its own deps, etc.
# Stable digest across profile-set churn.
[base]
pkgs = [
    "nixpkgs#glibc",
    "nixpkgs#openssl",
    "nixpkgs#zlib",
    "nixpkgs#libffi",
    "nixpkgs#xorg.libX11",
    "nixpkgs#xorg.libXi",
    "nixpkgs#fontconfig",
    "nixpkgs#freetype",
    "nixpkgs#gtk3",
    "nixpkgs#dbus",
    "nixpkgs#alsa-lib",
    "nixpkgs#nspr",
    "nixpkgs#nss",
]

# GPU support profile. Built into /nix/var/nix/profiles/_gpu and folded into
# the base layer (like [base]); NOT an activatable app, so it's excluded from
# _meta.json. /usr/local/bin/nix-gpu-run references its vglrun + libvulkan to
# give Nix Chromium/QtWebEngine apps true GPU acceleration when the Kasm
# platform allocates a GPU. nix-gpu-run degrades to software rendering if this
# profile is absent, so omitting [gpu] simply disables GPU for the store image.
#   - virtualgl:     glibc-matched VirtualGL faker (system /opt/VirtualGL can't
#                    preload into a Nix binary).
#   - vulkan-loader: carries VK_KHR_surface/xcb WSI that chrome's bundled loader
#                    lacks, so ANGLE-Vulkan reaches the GPU instead of SwiftShader.
[gpu]
# virtualgl-min: a trimmed VirtualGL from bin/nix-gpu-overlay (mounted into the
# inner build at /config/gpu-overlay) that drops the FLTK-based `vglconfig` GUI
# and the 32-bit variant. Stock virtualgl drags the FULL gcc ×2 + binutils +
# python3 (~1GB) into the base via fltk-config; we only ever run `vglrun -d egl`.
# The overlay is pinned to the same nixpkgs rev as [nixpkgs].ref above so its
# deps dedup with the rest of the build. See design/nix-dedup-gap.md.
pkgs = [
    "path:/config/gpu-overlay#virtualgl-min",
    "nixpkgs#vulkan-loader",
]

# Build script warns when a non-base store path appears in >= N% of
# profiles. Operator decides whether to promote it to [base].
[promote]
threshold_percent = 80

# Named intermediate layers, inserted between [base] and per-profile deltas
# in the OCI image. Each layer's closure is subtracted from any profile whose
# own closure is a superset, so shared runtimes don't repeat per app.
#
# Caveat on electron: most Electron apps in nixpkgs (Slack, VSCode, Discord,
# Obsidian) vendor their own bundled Electron binary and do NOT depend on
# nixpkgs#electron at runtime. The electron layer only deduplicates apps that
# genuinely reference pkgs.electron as a store dependency. Check with:
#   nix-store -qR /nix/var/nix/profiles/<app> | grep electron
# before assuming dedup will occur.
#
# Qt6 is a better candidate for the current catalog: telegram-desktop, vlc,
# qbittorrent all share pkgs.qt6.* closures (built from source in nixpkgs),
# so those paths do appear verbatim in every Qt6 app's closure.
[layers.electron]
pkgs = ["nixpkgs#electron"]

[layers.qt6]
pkgs = [
    "nixpkgs#qt6.qtbase",
    "nixpkgs#qt6.qtdeclarative",
    "nixpkgs#qt6.qtsvg",
    "nixpkgs#qt6.qtwayland",
]

# One section per profile. Profile names become directory names under
# /nix/var/nix/profiles/ in the final volume.

[profiles.chromium]
pkgs = ["nixpkgs#chromium"]
ref  = "github:NixOS/nixpkgs/nixos-unstable"

[profiles.onlyoffice]
pkgs      = ["nixpkgs#onlyoffice-desktopeditors"]
kasm_name = "only-office"
# Track unstable: 25.05 ships 9.0.0.172, whose CEF null-derefs at startup on
# headless KasmVNC (stat(NULL) after an empty /changes/ doc path). Testing a
# newer upstream rev to see if the crash is fixed. Revert to default if not.
ref       = "github:NixOS/nixpkgs/nixos-unstable"
# nixpkgs ships an x86_64-linux binary only — skip on arm64 builds.
# Drop or extend the list once an upstream arm64 build exists.
platforms = ["amd64"]

[profiles.vscode]
pkgs = ["nixpkgs#vscode"]
# kasm_name: published image name when it differs from the profile name
# (matches Kasm's Docker Hub naming, e.g. kasmweb/vs-code). Defaults to the
# profile name when omitted. Used only for the published tag, not internally.
kasm_name = "vs-code"

[profiles.obsidian]
pkgs = ["nixpkgs#obsidian"]

# KDE Angelfish: lightweight QtWebEngine-based browser. Demonstrates
# the kdePackages.<name> attribute path (Plasma 6 / KF6 namespace).
# Requires the env wiring in /usr/local/bin/nix-launch (drops
# Kasm's baked LD_LIBRARY_PATH, adds Qt software-render env vars,
# disables Chromium zygote/sandbox) — works in headless KasmVNC once
# that wrapper is in place.
[profiles.angelfish]
pkgs = ["nixpkgs#kdePackages.angelfish"]

# AI coding CLIs — separate profiles so users can activate any subset.
# All three ride nixos-unstable for fast (often weekly) security and
# feature updates. Trade-off: their shared unstable-Node closure
# duplicates across the three deltas — the auto-promote analyzer will
# surface this (each unstable lib appears in 100% of AI-CLI profiles).
# For a richer registry footprint optimisation, see the phase-2 note
# on Nix overlays in design/nix-package-process.md.
[profiles.claude-code]
pkgs     = ["nixpkgs#claude-code"]
ref      = "github:NixOS/nixpkgs/nixos-unstable"
requires = ["node"]

[profiles.opencode]
pkgs     = ["nixpkgs#opencode"]
ref      = "github:NixOS/nixpkgs/nixos-unstable"
requires = ["node"]

[profiles.codex]
pkgs     = ["nixpkgs#codex"]
ref      = "github:NixOS/nixpkgs/nixos-unstable"
requires = ["node"]

# Ptyxis re-enabled now that container-init exposes
# org.freedesktop.systemd1.Manager.StartTransientUnit as a no-op
# compatibility surface (see --systemd1-shim flag, container-init
# v1.1+). With that, systemd-run --user --scope returns success and
# Ptyxis spawns its shell normally even though we have no real
# systemd. The shim does not create cgroups or honor resource
# properties — it just unblocks the probe.
[profiles.ptyxis]
pkgs = ["nixpkgs#ptyxis"]

# WezTerm remains disabled: wezterm-gui calls eglGetDisplay and Xvnc
# doesn't expose EGL natively. The CLI binary still works if invoked
# headlessly. Revisit if KasmVNC gains EGL passthrough.

# Language runtimes. Nix ships the runtime + global CLIs; per-project
# libraries land in user home via npm/pip/uv (NPM_CONFIG_PREFIX and
# PIPX_HOME are exported by nix-activate so installs go to
# ~/.local/share/{npm,pipx}).
[profiles.node]
pkgs = [
    "nixpkgs#nodejs_22",
    "nixpkgs#pnpm",
    "nixpkgs#corepack",
]

[profiles.python]
pkgs = [
    "nixpkgs#python3",
    "nixpkgs#uv",
    "nixpkgs#pipx",
]

# ─────────────────────────────────────────────────────────────────────
# Application catalog (Phase 1)
#
# Migration of the workspaces-images single-app / desktop catalog onto
# Nix. See design/nix-app-catalog.md for the full classification table,
# topology decision (shared store vs baked single-app), and phasing.
#
# All entries below are existing nixpkgs attributes — no Nix code. The
# build script already exports NIXPKGS_ALLOW_UNFREE=1 /
# NIXPKGS_ALLOW_INSECURE=1, so unfree apps (Chrome, Slack, Zoom, …) build
# without extra config.
#
# Attribute names marked "verify" in the design doc should be confirmed
# with `nix search nixpkgs <name>` against the pinned ref before relying
# on a production build. A few apps are NOT here on purpose:
#   - custom derivation needed (nix/pkgs/<app>): nessus, maltego, hunchly,
#     cyberbro — tracked in the design doc, added once written.
#   - dropped / keep-apt: atom (EOL), vmware-horizon, keeper, zoho_email,
#     redroid (needs host kernel modules).
# This is a *menu*: a store need not build every profile. Use
# `build-nix-store-volume --profile <name>` to build subsets.
# ─────────────────────────────────────────────────────────────────────

# ── Browsers (fast cadence → nixos-unstable, like chromium above) ──────
[profiles.firefox]
pkgs = ["nixpkgs#firefox"]
ref  = "github:NixOS/nixpkgs/nixos-unstable"

[profiles.chrome]
pkgs = ["nixpkgs#google-chrome"]
ref  = "github:NixOS/nixpkgs/nixos-unstable"

[profiles.brave]
pkgs = ["nixpkgs#brave"]
ref  = "github:NixOS/nixpkgs/nixos-unstable"

[profiles.vivaldi]
pkgs = ["nixpkgs#vivaldi"]
ref  = "github:NixOS/nixpkgs/nixos-unstable"

[profiles.edge]
pkgs = ["nixpkgs#microsoft-edge"]
ref  = "github:NixOS/nixpkgs/nixos-unstable"

[profiles.torbrowser]
pkgs = ["nixpkgs#tor-browser"]
kasm_name = "tor-browser"

# ── Communication / collaboration ─────────────────────────────────────
[profiles.slack]
pkgs = ["nixpkgs#slack"]

[profiles.discord]
pkgs = ["nixpkgs#discord"]

[profiles.signal]
pkgs = ["nixpkgs#signal-desktop"]

[profiles.telegram]
pkgs = ["nixpkgs#telegram-desktop"]

[profiles.teams]
# Microsoft discontinued the native Linux Teams client; teams-for-linux
# is the maintained community wrapper that nixpkgs ships.
pkgs = ["nixpkgs#teams-for-linux"]

[profiles.zoom]
pkgs      = ["nixpkgs#zoom-us"]
# nixpkgs ships an x86_64-linux build only.
platforms = ["amd64"]

[profiles.thunderbird]
pkgs = ["nixpkgs#thunderbird"]

# ── Office / productivity ─────────────────────────────────────────────
[profiles.libreoffice]
pkgs = ["nixpkgs#libreoffice"]
kasm_name = "libre-office"

[profiles.nextcloud]
pkgs = ["nixpkgs#nextcloud-client"]

# ── Creative / media ──────────────────────────────────────────────────
[profiles.gimp]
pkgs = ["nixpkgs#gimp"]

[profiles.inkscape]
pkgs = ["nixpkgs#inkscape"]

[profiles.pinta]
pkgs = ["nixpkgs#pinta"]

[profiles.vlc]
pkgs = ["nixpkgs#vlc"]

[profiles.audacity]
pkgs = ["nixpkgs#audacity"]

[profiles.obs]
# OBS uses the GPU when one is allocated; otherwise software encode.
# Launch via the angelfish-launch-style VirtualGL gate for acceleration.
pkgs = ["nixpkgs#obs-studio"]

[profiles.blender]
# GPU app — needs the VirtualGL launcher gate for acceleration; renders
# in software otherwise (blender/launch -> nix-gpu-run).
# sdl3^lib: Blender dlopens libSDL3.so.0 (sdlew, joystick input) at startup but
# it's NOT in blender's closure — without it Blender SIGABRTs at "Failed loading
# SDL3 library". The lib output lands in /nix/var/nix/profiles/blender/lib, which
# blender/launch puts on LD_LIBRARY_PATH for the dlopen.
pkgs = ["nixpkgs#blender", "nixpkgs#sdl3^lib"]

# ── Dev tools ─────────────────────────────────────────────────────────
[profiles.insomnia]
pkgs = ["nixpkgs#insomnia"]

[profiles.postman]
pkgs = ["nixpkgs#postman"]

[profiles.sublime-text]
pkgs = ["nixpkgs#sublime4"]

[profiles.android-studio]
pkgs = ["nixpkgs#android-studio"]

[profiles.terraform]
# Unfree since BSL relicense; `opentofu` is the free fork if licensing
# matters for a given deployment.
pkgs = ["nixpkgs#terraform"]

[profiles.ansible]
pkgs = ["nixpkgs#ansible"]

# ── Remote access / networking / file transfer ────────────────────────
[profiles.remmina]
pkgs = ["nixpkgs#remmina"]

[profiles.filezilla]
pkgs = ["nixpkgs#filezilla"]

[profiles.deluge]
pkgs = ["nixpkgs#deluge"]

[profiles.qbittorrent]
pkgs = ["nixpkgs#qbittorrent"]

# ── Games / emulators (GPU; some need i386 multilib) ──────────────────
[profiles.retroarch]
# GPU app — VirtualGL launcher gate for acceleration.
pkgs = ["nixpkgs#retroarch"]

[profiles.minetest]
# Renamed upstream: minetest → luanti. GPU app.
pkgs = ["nixpkgs#luanti"]

[profiles.super-tux-kart]
# GPU app.
pkgs = ["nixpkgs#superTuxKart"]

[profiles.steam]
# nixpkgs ships steam as an FHS-wrapped derivation (its own chroot env).
# x86_64 only; needs GPU + i386 userspace, both handled by the wrapper.
pkgs      = ["nixpkgs#steam"]
platforms = ["amd64"]
