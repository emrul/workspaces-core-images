# Self-hosted app manifest — drives the updater (bin/nix-kasm-update) and the CI
# schedules. See design/nix-self-hosted-packages.md.
#
#   kind      = override | binary | source
#               override → reuse a nixpkgs derivation, swap version+src
#               binary   → prebuilt .deb/AppImage/tarball (autoPatchelf/FHS)
#               source   → build from source (language builder)
#   discover  = how the updater finds the newest version:
#               "chrome-version-api"        Google Chrome version-history API
#               "github-releases:owner/repo" latest GitHub release tag
#               "nix-update"                delegate to nix-update
#   cadence   = which schedule runs this app's updater:
#               twice-daily | weekly | manual
#   platforms = build targets (amd64 | arm64)

[apps.chrome]
kind      = "override"
discover  = "chrome-version-api"
cadence   = "twice-daily"
platforms = ["amd64"]

# KasmVNC is a Kasm SERVICE (not an app-catalog entry): a from-scratch Nix build
# of the KasmVNC server so the runtime base is distro-independent (no per-distro
# .deb). Bumped by hand when tracking the KasmVNC fork (pin.json rev/version).
[apps.kasmvnc]
kind      = "source"
discover  = "manual"
cadence   = "manual"
platforms = ["amd64", "arm64"]

# kasm-session-runtime is also a Kasm SERVICE, not an app-catalog entry: the
# MCP/CDP drive-session binary, baked into [base] (bin/nix-profiles.toml),
# not selectable per-session. "binary" because the fetched artifact is a
# prebuilt release, not something built from source inside this overlay's
# own sandbox (gitlab.com/kasm-technologies/labs-sandbox/kasm-session-runtime
# is a private project; see pkgs/kasm-session-runtime/package.nix's doc
# comment for why). No automated discoverer yet -- bump pin.json by hand
# against a tagged kasm-session-runtime release until one exists.
[apps.kasm-session-runtime]
kind      = "binary"
discover  = "manual"
cadence   = "manual"
platforms = ["amd64", "arm64"]

# kasm-ai-runtime-sidebar: the runtime's in-session sidebar (web assets for a
# second KasmVNC web root, materialised by kasm-setup only when a session sets
# KASM_VNC_PATH=/usr/share/kasmvnc-agent). Same release and S3 prefix as
# kasm-session-runtime -- bump the two pin.json files together, by hand,
# against the same tag. Architecture-independent tarball.
[apps.kasm-ai-runtime-sidebar]
kind      = "binary"
discover  = "manual"
cadence   = "manual"
platforms = ["amd64", "arm64"]

# kasm-wine: wine-assess's wine fork (upstream tarball + vendored patch series), the
# runtime every packaged Windows app profile requires. Moves are made by hand in the
# fork (wine-assess/docs/wine-fork.md) and land here as a regenerated patches/ dir plus
# a pin.json bump, so no automated discoverer.
[apps.kasm-wine]
kind      = "source"
discover  = "manual"
cadence   = "manual"
platforms = ["amd64"]
