# Registry / namespace / tag configuration for local and dev builds.
#
# Source this file from any build or run script:
#   source "$(dirname "$0")/registry.conf"
#   docker build -t "$(kasm_image nix-chrome)" ...
#
# Override any variable via the environment before sourcing:
#   KASM_REGISTRY=registry.kasm.com KASM_NAMESPACE=prod source runs/registry.conf
#
# Production values should be set via CI/CD environment variables;
# this file supplies the dev defaults only.

KASM_REGISTRY="${KASM_REGISTRY:-forge.emrul.dev}"
KASM_NAMESPACE="${KASM_NAMESPACE:-beta}"
KASM_TAG="${KASM_TAG:-nix}"

# Pinned nixpkgs commit for dockerfile-nix-app builds.
# Bump together with nix-profiles.toml's [nixpkgs].ref at the next
# nixos stable release boundary (~6 monthly).
# Current: nixos-25.05 @ 2025-06-xx
KASM_NIXPKGS_REV="${KASM_NIXPKGS_REV:-ac62194c3917d5f474c1a844b6fd6da2db95077d}"

# kasm_image <name>  →  $KASM_REGISTRY/$KASM_NAMESPACE/<name>:$KASM_TAG
kasm_image() { echo "${KASM_REGISTRY}/${KASM_NAMESPACE}/${1}:${KASM_TAG}"; }
