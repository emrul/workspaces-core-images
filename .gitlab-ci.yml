# ==========================================================================
# Kasm Nix app-image catalog — build & publish pipeline (forge DinD model)
# ==========================================================================
# Runs on the self-hosted `nix-builder` runner (forge box, containerd+nerdctl,
# no host docker/podman engine) and drives the proven nix-portal
# podman-in-podman harness. All heavy work happens inside quay.io/podman/stable
# against the PERSISTENT podman store at $DIND_ROOT/containers — that warm store
# (Nix dedup + podman layer cache) is the whole caching strategy, so reruns
# fetch almost nothing.
#
#   base    — (manual) build core-minimal + nix-ubuntu into the store
#   build   — build-nix-store-volume --emit-app-images (all GUI apps)
#   publish — tag each to its kasm name + push to $REGISTRY_NS
#
# Registry migration is one variable:
#   REGISTRY_NS = $CI_REGISTRY_IMAGE  → GitLab Container Registry (default, now)
#   REGISTRY_NS = docker.io/kasmweb   → Docker Hub kasmweb/<name>:nix (later)
#
# Runner requirements (see docs/nix-ci.md): tag `nix-builder`, shell executor,
# passwordless sudo for nerdctl, and the persistent /srv/nix-build store.
# The previous core-distro pipeline is preserved at ci-scripts/gitlab-ci-core.yml.
# ==========================================================================

variables:
  KASM_TAG: "nix"
  REGISTRY_NS: "$CI_REGISTRY_IMAGE"
  # Optional space list to restrict the build, e.g. "onlyoffice vscode".
  NIX_PROFILES: ""
  DIND_ROOT: "/srv/nix-build"
  DIND_IMG: "quay.io/podman/stable"

default:
  tags: [nix-builder]
  interruptible: true

stages:
  - base
  - build
  - publish

# ── base: core-minimal + nix-ubuntu into the persistent store (on demand) ───
# Manual + allow_failure so it never blocks build/publish; play it (or trigger
# via the API) when the base dockerfiles / core install tree change. Normal
# runs reuse the warm nix-ubuntu:dev already in the store.
base:
  stage: base
  when: manual
  allow_failure: true
  script:
    - |
      sudo nerdctl run --rm --privileged \
        -v "$DIND_ROOT/containers:/var/lib/containers" \
        -v "$CI_PROJECT_DIR:/work:ro" \
        "$DIND_IMG" bash /work/runs/nix-portal/dind-base.sh

# ── build: deduped Nix store + one runnable image per GUI profile ───────────
build:
  stage: build
  timeout: 4h
  script:
    - |
      sudo nerdctl run --rm --privileged \
        -v "$DIND_ROOT/containers:/var/lib/containers" \
        -v "$DIND_ROOT/output:/root/.cache/nix-build-output" \
        -v "$CI_PROJECT_DIR:/work:ro" \
        -e PROFILES="$NIX_PROFILES" \
        "$DIND_IMG" /work/runs/nix-portal/dind-build.sh

# ── publish: tag kasm names + push (inside the store where the images live) ─
publish:
  stage: publish
  script:
    - |
      sudo nerdctl run --rm --privileged \
        -v "$DIND_ROOT/containers:/var/lib/containers" \
        -v "$CI_PROJECT_DIR:/work:ro" \
        -e REGISTRY_NS="$REGISTRY_NS" -e KASM_TAG="$KASM_TAG" \
        -e REG="$CI_REGISTRY" -e REG_USER="$CI_REGISTRY_USER" -e REG_PASS="$CI_REGISTRY_PASSWORD" \
        "$DIND_IMG" bash -c '
          set -euo pipefail
          echo "$REG_PASS" | podman login "$REG" -u "$REG_USER" --password-stdin
          DOCKER=podman bash /work/ci-scripts/nix-publish.sh
        '
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
