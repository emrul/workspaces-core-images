# ==========================================================================
# Kasm Nix app-image catalog — build & publish pipeline (forge DinD model)
# ==========================================================================
# Runs on the self-hosted `nix-builder` runner (forge box, containerd+nerdctl,
# no host docker/podman engine) and drives the nix-portal podman-in-podman
# harness. All heavy work happens inside quay.io/podman/stable against the
# PERSISTENT podman store at $DIND_ROOT/containers — that warm store (Nix dedup
# + podman layer cache) is the caching strategy, so reruns fetch almost nothing.
#
#   prepare — change-gating: compute NIX_PROFILES from the commit diff
#   base    — (manual) build core-minimal + nix-ubuntu into the store
#   build   — build-nix-store-volume --emit-app-images (fat store + per-app,
#             per-app builds parallelised by BUILD_PARALLEL)
#   publish — tag each to its kasm name + push to $REGISTRY_NS (scoped)
#
# Change-gating (prepare → dotenv NIX_PROFILES):
#   ""         whole catalog (shared/base changed, schedule, or unknown diff)
#   "a b c"    only these apps (their src/ubuntu/install/nix/<app>/ changed)
#   "__none__" nothing image-relevant changed → build+publish skip
# A manual/trigger NIX_PROFILES variable overrides the computed value.
#
# Registry migration is one variable:
#   REGISTRY_NS = $CI_REGISTRY_IMAGE  → GitLab Container Registry (default, now)
#   REGISTRY_NS = docker.io/kasmweb   → Docker Hub kasmweb/<name>:nix (later)
#
# Runner: tag `nix-builder`, shell executor, passwordless sudo for nerdctl,
# persistent /srv/nix-build. See docs/nix-ci.md. Old core-distro pipeline is at
# ci-scripts/gitlab-ci-core.yml.
# ==========================================================================

variables:
  KASM_TAG: "nix"
  REGISTRY_NS: "$CI_REGISTRY_IMAGE"
  NIX_PROFILES: ""          # manual override; else `prepare` computes it
  NIX_BASES: ""             # publish-base filter; empty = every base in the store
  BUILD_PARALLEL: "4"       # per-app build concurrency in build-nix-store-volume
  ALLOW_STALE_BASE: ""      # set "1" to bypass the build's base-freshness guard
  # Disk budget (enforced by dind-build.sh's pre-flight gate + end-of-build reclaim
  # + nix-gc.sh). Tune to the runner's provisioned disk — see docs/ci_cd_flow.md.
  # OPS SIZING: provision the store at
  #     total >= NIX_STAGE_CAP_G + DISK_MIN_GB + ~60G (base images + containerd + margin)
  # A cold full catalog build GROWS ~150G (observed); DISK_MIN_GB must exceed that so
  # the build completes without ENOSPC, and the end-of-build reclaim then returns the
  # transient ~89G cache to scan-nix/publish. With cap=150 + floor=200 → 410G min;
  # PROVISION 500G. Keep NIX_STAGE_CAP_G pinned (an unbounded cache breaks the budget).
  DISK_MIN_GB: "200"        # min free GB before build; GC-then-fail if unmet
  NIX_STAGE_CAP_G: "150"    # cap the warm Nix build cache; GC resets it if over
  DIND_ROOT: "/srv/nix-build"
  DIND_IMG: "quay.io/podman/stable"
  GIT_SUBMODULE_STRATEGY: normal
  NIX_GC: ""                # set to "1" on a scheduled pipeline → run only `gc`
  NIX_UPDATE: ""            # set to a cadence (twice-daily|weekly) on a schedule
                            # → run bin/nix-kasm-update first to refresh self-hosted
                            # pins (Chrome, …). See design/nix-self-hosted-packages.md.
  NIX_EVAL_GATE: "1"        # ON by default: build keeps warm (skips reinstalling)
                            # profiles whose inputs (resolved rev + attrs + overlay
                            # sources) are unchanged since the last build. Fail-safe
                            # (any doubt → rebuild); needs a warm staging volume +
                            # /output/labels.prev.json to skip anything. Set "" to
                            # disable. See design/nix-self-hosted-packages.md.

default:
  tags: [nix-builder]
  interruptible: true
  after_script:
    # Orphan-on-cancel guard: `sudo nerdctl run` is root-owned and survives the
    # runner killing the job's (gitlab-runner) process group on cancel/timeout.
    # after_script runs on cancel/timeout/failure and force-removes the named
    # container so it can't keep building and holding the podman store lock.
    - sudo nerdctl rm -f "nixci-${CI_JOB_NAME}-${CI_PIPELINE_ID}" >/dev/null 2>&1 || true
    # Root-owned-artifact guard: a cancelled scan/publish job skips its
    # in-container chown-back, leaving root-owned files (sboms/, grype/, …)
    # that fail the NEXT job's `git clean` at checkout (seen: pipeline
    # 2687485367 prepare). Runner sudo is nerdctl-scoped, so un-root the
    # workdir via a container. Idempotent, best-effort.
    - sudo nerdctl run --rm -v "$CI_PROJECT_DIR:/w" quay.io/podman/stable chown -R "$(id -u):$(id -g)" /w >/dev/null 2>&1 || true

stages:
  - prepare
  - base
  - build
  - publish
  - scan
  - test
  - maintenance

# ── vex-lint: regression-test the VEX suppression gate ──────────────────────
# nix-vex-lint.sh decides what the scanner HIDES; its rejection cases are
# committed fixtures, verified whenever the gate, the fixtures, or the live
# statement file change. Cheap (jq only), runs on the shell runner.
vex-lint:
  stage: prepare
  needs: []
  rules:
    - if: '$NIX_GC == "1"'
      when: never
    - if: '$NIX_UPDATE != ""'   # update pipelines only bump+push pins (BP-01);
      when: never               # the pushed commit's own pipeline ships them
    - changes:
        - ci-scripts/nix-vex-lint.sh
        - ci-scripts/tests/vex-lint-test.sh
        - ci-scripts/tests/vex/**
        - security/vex/**
  script:
    - bash ci-scripts/tests/vex-lint-test.sh

# ── assess-test: regression-test the assessment-envelope producer ───────────
# nix-assess.py is the BP-02/BP-03 fail-closed join (see the kasm-nix-remediator
# design). Its negative fixtures are committed; verified whenever the producer,
# the fixtures, or the schema contract change. Runs in $DIND_IMG for python3.
assess-test:
  stage: prepare
  needs: []
  rules:
    - if: '$NIX_GC == "1"'
      when: never
    - if: '$NIX_UPDATE != ""'   # update pipelines only bump+push pins (BP-01);
      when: never               # the pushed commit's own pipeline ships them
    - changes:
        - ci-scripts/nix-assess.py
        - ci-scripts/tests/assess-test.sh
        - ci-scripts/tests/assess/**
        - ci-scripts/schemas/**
  script:
    - sudo nerdctl run --rm -v "$CI_PROJECT_DIR:/w:ro" "$DIND_IMG" bash /w/ci-scripts/tests/assess-test.sh

# ── prepare: change-gating → NIX_PROFILES dotenv ────────────────────────────
prepare:
  stage: prepare
  needs: []
  rules:
    - if: '$NIX_GC == "1"'      # GC-only schedule → don't build
      when: never
    - if: '$NIX_UPDATE != ""'   # update pipelines only bump+push pins (BP-01)
      when: never
    - when: on_success
  script:
    - bash ci-scripts/nix-changed-profiles.sh | tee build.env
  artifacts:
    reports:
      dotenv: build.env

# ── nix-update: refresh self-hosted package pins (scheduled, commit-first) ──
# Runs ONLY when a schedule sets NIX_UPDATE=<cadence>, and it is the ONLY job
# on that pipeline (every build-chain job skips on NIX_UPDATE != "").
#
# BP-01, immutable source (kasm-nix-remediator design): a shipped image must be
# built from a commit whose tree contains every shipped pin. So the updater
# COMMITS FIRST: it pushes the bump WITHOUT ci.skip and the pushed commit's own
# pipeline builds, scans, publishes and assesses it — CI_COMMIT_SHA, image
# labels, and every report then agree on one commit that really contains the
# pins. The old flow (same-pipeline pin artifacts overlaid onto the pre-bump
# checkout, push as best-effort ci.skip audit) shipped pins that no recorded
# commit contained whenever the push failed. A missing NIX_UPDATE_TOKEN or a
# rejected push therefore FAILS this job now: an unpushable bump must not ship,
# and the red job is the alert. No loop risk: the push pipeline has NIX_UPDATE
# unset, so it never runs this job. See design/nix-self-hosted-packages.md.
nix-update:
  stage: prepare
  needs: []
  rules:
    - if: '$NIX_UPDATE == ""'
      when: never
    - when: on_success
  script:
    - |
      set -euo pipefail
      git config user.email "nix-ci@kasmweb.com"
      git config user.name  "kasm-nix-bot"
      before="$(git rev-parse HEAD)"
      bash bin/nix-kasm-update --cadence "$NIX_UPDATE" --commit --date "$(date -u +%F)"
      after="$(git rev-parse HEAD)"
      if [ "$before" = "$after" ]; then
        echo "no pin changes — nothing to ship"
        exit 0
      fi
      if [ -z "${NIX_UPDATE_TOKEN:-}" ]; then
        echo "FATAL: NIX_UPDATE_TOKEN unset — cannot push the pin commit, refusing to ship pins no commit contains (BP-01)" >&2
        exit 1
      fi
      git remote set-url --push origin "https://oauth2:${NIX_UPDATE_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git push origin "HEAD:${CI_COMMIT_REF_NAME}"
      echo "pushed pin commit(s); the push pipeline builds and ships them from their own commit"
  artifacts:
    when: on_success
    expire_in: 30 days
    paths:
      - bin/nix-kasm-overlay/pkgs/*/pin.json

# ── gc: bound the persistent podman store (scheduled). Runs ONLY when a
# pipeline schedule sets NIX_GC=1 — the build/publish jobs skip on that run.
# Prunes dangling + superseded per-app images and stale anonymous volumes, and
# resets the nix-build-stage-* Nix cache only if it exceeds a size cap. Keeps the
# warm cache + base images. See design/nix-ci-disk.md.
gc:
  stage: maintenance
  needs: []
  rules:
    - if: '$NIX_GC == "1"'
  script:
    - |
      bash ci-scripts/dind-run.sh "nixci-${CI_JOB_NAME}-${CI_PIPELINE_ID}" \
        -v "$DIND_ROOT/containers:/var/lib/containers" \
        -v "$CI_PROJECT_DIR:/work:ro" \
        -e NIX_STAGE_CAP_G="$NIX_STAGE_CAP_G" \
        "$DIND_IMG" sh /work/ci-scripts/nix-gc.sh

# ── base-check: decide which distro bases need rebuilding (prepare) ──────────
# Emits NIX_BASES_REBUILD = union of:
#   • NIX_BASES_AFFECTED  — distro base INPUTS changed in this diff (from prepare)
#   • upstream-digest staleness — the source image (ubuntu:24.04, fedora:42,
#     alpine:3.21) moved vs the digest stamped on the local nix-<distro>:dev base
#     (nix-base-check.sh, run in DIND). Only checked on publishing pipelines
#     (schedule/web/default) to avoid a container pull on every feature push;
#     code-change rebuilds still work off NIX_BASES_AFFECTED everywhere.
base-check:
  stage: prepare
  needs: [prepare]
  rules:
    - if: '$NIX_GC == "1"'
      when: never
    - if: '$NIX_UPDATE != ""'   # update pipelines only bump+push pins (BP-01);
      when: never               # the pushed commit's own pipeline ships them
    - when: on_success
  script:
    - |
      set -euo pipefail
      stale=""
      digest_check=0
      case "${CI_PIPELINE_SOURCE:-}" in schedule|web) digest_check=1 ;; esac
      [ "${CI_COMMIT_BRANCH:-}" = "${CI_DEFAULT_BRANCH:-}" ] && digest_check=1
      if [ "${digest_check}" = 1 ]; then
        out="$(bash ci-scripts/dind-run.sh "nixci-${CI_JOB_NAME}-${CI_PIPELINE_ID}" \
          -v "$DIND_ROOT/containers:/var/lib/containers" \
          -v "$CI_PROJECT_DIR:/work:ro" \
          -e BASE_DISTROS="${BASE_DISTROS:-}" \
          "$DIND_IMG" bash /work/ci-scripts/nix-base-check.sh)"
        echo "$out"
        stale="$(printf '%s\n' "$out" | sed -n 's/^NIX_BASES_STALE=//p' | tail -1)"
      else
        echo "[base-check] non-publishing pipeline — skipping upstream digest check"
      fi
      reb="$(printf '%s\n' ${NIX_BASES_AFFECTED:-} ${stale} | sort -u | tr '\n' ' ' | sed 's/^ *//;s/ *$//')"
      echo "distro bases to rebuild: '${reb}'  (affected='${NIX_BASES_AFFECTED:-}' stale='${stale}')"
      echo "NIX_BASES_REBUILD=${reb}" > base.env
  artifacts:
    reports:
      dotenv: base.env

# ── base: (re)build the stale/affected distro bases into the store, in parallel ─
# Driven by NIX_BASES_REBUILD (from base-check). Builds core + nix-<distro> for
# each needed distro, parallel across distros (BUILD_PARALLEL), stamping each with
# its source-image digest for the next staleness check. Skips fast when all bases
# are fresh. Force a rebuild of specific distros with the BASE_DISTROS pipeline
# variable (e.g. "ubuntu fedora alpine") on a web pipeline.
base:
  stage: base
  needs: [base-check]
  # A full multi-distro rebuild (3× core + nix) plus serial retries can exceed
  # GitLab's 1h default; the old per-distro jobs each built one distro. Give it
  # room (the build job is 4h).
  timeout: 3h
  rules:
    - if: '$NIX_GC == "1"'
      when: never
    - if: '$NIX_UPDATE != ""'   # update pipelines only bump+push pins (BP-01);
      when: never               # the pushed commit's own pipeline ships them
    - when: on_success
  script:
    - |
      reb="${BASE_DISTROS:-${NIX_BASES_REBUILD:-}}"
      if [ -z "$(printf '%s' "$reb" | tr -d '[:space:]')" ]; then
        echo "all distro bases fresh — nothing to rebuild"; exit 0
      fi
      echo "rebuilding distro bases: ${reb}  (parallel=${BUILD_PARALLEL})"
      bash ci-scripts/dind-run.sh "nixci-${CI_JOB_NAME}-${CI_PIPELINE_ID}" \
        -v "$DIND_ROOT/containers:/var/lib/containers" \
        -v "$CI_PROJECT_DIR:/work:ro" \
        -e BASE_DISTROS="${reb}" -e BUILD_PARALLEL="$BUILD_PARALLEL" \
        -e BASE_BUILT_SHA="$CI_COMMIT_SHA" \
        "$DIND_IMG" bash /work/ci-scripts/nix-base-build.sh

# ── build: fat store + per-app images (parallel) ────────────────────────────
# (No nix-update artifact dependency: BP-01 — pins ship only from a commit
# that contains them; the checkout IS the source of truth.)
build:
  stage: build
  needs:
    - prepare
    - base-check           # for NIX_BASES_REBUILD (which bases actually rebuilt)
    - job: base            # wait for any base rebuild so apps build on the fresh base
      optional: true
  timeout: 4h
  rules:
    - if: '$NIX_GC == "1"'
      when: never
    - if: '$NIX_UPDATE != ""'   # update pipelines only bump+push pins (BP-01);
      when: never               # the pushed commit's own pipeline ships them
    - when: on_success           # NIX_EVAL_GATE is on by default (see variables)
  script:
    - |
      if [ "${NIX_PROFILES:-}" = "__none__" ]; then echo "no image-relevant changes — skipping build"; exit 0; fi
      # Re-assembly trigger: whether the ubuntu base actually rebuilt this run
      # (base-check's NIX_BASES_REBUILD, or a manual BASE_DISTROS override) — the
      # signal that eval-gated/warm apps must be re-stacked onto the new base.
      # This is source-agnostic: it fires for commit base-file changes AND for a
      # schedule that rebuilt ubuntu on upstream-digest staleness (where
      # NIX_BASE_AFFECTED is 0), unlike the commit-diff-only NIX_BASE_AFFECTED
      # (which stays the base-freshness GUARD signal in dind-build.sh).
      _reb="${BASE_DISTROS:-${NIX_BASES_REBUILD:-}}"
      case " ${_reb} " in *" ubuntu "*) NIX_BASE_REBUILT=1 ;; *) NIX_BASE_REBUILT=0 ;; esac
      echo "building profiles: ${NIX_PROFILES:-<all>}  (per-app parallel=${BUILD_PARALLEL}, eval-gate=${NIX_EVAL_GATE:-0}, ubuntu-base-rebuilt=${NIX_BASE_REBUILT})"
      # Resolute multi-store desktop apps (app_base="resolute" in the profile TOML)
      # are ALSO assembled onto the Resolute nix base. Derived from the TOML (not
      # hardcoded); a missing/absent resolute base is non-fatal — nix-crane-assemble
      # warns + skips. dind-build.sh maps RESOLUTE_APPS → --resolute-app.
      RESOLUTE_APPS="$(awk '/^\[profiles\./{p=$0;sub(/^\[profiles\./,"",p);sub(/\].*/,"",p)} /^[[:space:]]*app_base[[:space:]]*=/&&p!=""{v=$0;sub(/^[^"]*"/,"",v);sub(/".*/,"",v);if(v=="resolute")printf "%s ",p}' bin/nix-profiles.toml)"
      echo "resolute multi-store apps: ${RESOLUTE_APPS:-<none>}"
      bash ci-scripts/dind-run.sh "nixci-${CI_JOB_NAME}-${CI_PIPELINE_ID}" \
        -v "$DIND_ROOT/containers:/var/lib/containers" \
        -v "$DIND_ROOT/output:/root/.cache/nix-build-output" \
        -v "$CI_PROJECT_DIR:/work:ro" \
        -e PROFILES="$NIX_PROFILES" -e BUILD_PARALLEL="$BUILD_PARALLEL" \
        -e NIX_BASE_AFFECTED="$NIX_BASE_AFFECTED" -e NIX_BASE_REBUILT="$NIX_BASE_REBUILT" \
        -e CI_COMMIT_SHA="$CI_COMMIT_SHA" \
        -e RESOLUTE_APPS="$RESOLUTE_APPS" -e RESOLUTE_BASE_IMAGE="localhost/nix-ubuntu-resolute:dev" \
        -e ALLOW_STALE_BASE="$ALLOW_STALE_BASE" -e NIX_EVAL_GATE="$NIX_EVAL_GATE" \
        -e DISK_MIN_GB="$DISK_MIN_GB" -e NIX_STAGE_CAP_G="$NIX_STAGE_CAP_G" \
        "$DIND_IMG" /work/runs/nix-portal/dind-build.sh

# ── publish-base: push the rebuilt Nix core/base images (kasm-core-<distro>:nix) ─
# Auto-runs on publishing pipelines (default branch / web / schedule) after the
# `base` job, scoped to the distros that were actually rebuilt this run
# (NIX_BASES_REBUILD → NIX_BASES filter), so the published base stays in sync with
# what per-app images are layered on (registry dedup). Skips when no base changed.
# Force-publish specific bases with the NIX_BASES pipeline variable. The image map
# lives in ci-scripts/nix-publish-base.sh.
publish-base:
  stage: publish
  needs: [base-check, base]
  rules:
    - if: '$NIX_GC == "1"'
      when: never
    - if: '$NIX_UPDATE != ""'   # update pipelines only bump+push pins (BP-01);
      when: never               # the pushed commit's own pipeline ships them
    - if: '$FORCE_PUBLISH == "1"'   # manual CLI publish (glab ci run) off any branch
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - |
      set -euo pipefail
      reb="${BASE_DISTROS:-${NIX_BASES_REBUILD:-}}"
      # Map rebuilt distro names → published base repo filter, unless NIX_BASES
      # was set explicitly (manual override).
      if [ -z "${NIX_BASES:-}" ]; then
        filt=""
        for d in ${reb}; do case "$d" in
          ubuntu) filt="${filt} kasm-core-ubuntu kasm-core-ubuntu-minimal" ;;
          fedora) filt="${filt} kasm-core-fedora" ;;
          alpine) filt="${filt} kasm-core-alpine" ;;
          resolute) filt="${filt} kasm-core-ubuntu-resolute" ;;
        esac; done
        NIX_BASES="$(printf '%s' "${filt}" | sed 's/^ *//;s/ *$//')"
      fi
      if [ -z "$(printf '%s' "${NIX_BASES}" | tr -d '[:space:]')" ]; then
        echo "no base rebuilt this run — skipping publish-base"; exit 0
      fi
      echo "publishing rebuilt bases: ${NIX_BASES}"
      bash ci-scripts/dind-run.sh "nixci-${CI_JOB_NAME}-${CI_PIPELINE_ID}" \
        -v "$DIND_ROOT/containers:/var/lib/containers" \
        -v "$CI_PROJECT_DIR:/work:ro" \
        -e REGISTRY_NS="$REGISTRY_NS" -e KASM_TAG="$KASM_TAG" -e NIX_BASES="$NIX_BASES" \
        -e REG="$CI_REGISTRY" -e REG_USER="$CI_REGISTRY_USER" -e REG_PASS="$CI_REGISTRY_PASSWORD" \
        "$DIND_IMG" bash -c '
          set -euo pipefail
          echo "$REG_PASS" | podman login "$REG" -u "$REG_USER" --password-stdin
          DOCKER=podman bash /work/ci-scripts/nix-publish-base.sh
        '

# ── publish: tag kasm names + push (scoped to NIX_PROFILES) ──────────────────
publish:
  stage: publish
  needs: [prepare, build]
  script:
    - |
      if [ "${NIX_PROFILES:-}" = "__none__" ]; then echo "no image-relevant changes — skipping publish"; exit 0; fi
      # Mounts: the persistent output dir (rw) holds the build-side sidecars
      # nix-publish reads (labels.json, closure-diffs.*, metrics.json) and where
      # it writes the report; $CI_PROJECT_DIR is also mounted rw at /artifacts so
      # the (root) container can drop the report there and chown it to the runner
      # UID — GitLab then captures it and the next checkout can still clean it.
      # (Runner sudo is scoped to nerdctl, so the copy MUST happen in-container.)
      # NIX_PROFILES="" (not $NIX_PROFILES): builds are FULL-selection now, so
      # publish must consider every assembled image — the content compare
      # skips unchanged ones; a gated filter here would strand images that
      # rebuilt beyond the git-gated set (pin drift) and break fat↔app layer
      # dedup on the registry. The __none__ early-exit above still applies.
      bash ci-scripts/dind-run.sh "nixci-${CI_JOB_NAME}-${CI_PIPELINE_ID}" \
        -v "$DIND_ROOT/containers:/var/lib/containers" \
        -v "$DIND_ROOT/output:/root/.cache/nix-build-output" \
        -v "$CI_PROJECT_DIR:/work:ro" \
        -v "$CI_PROJECT_DIR:/artifacts" \
        -e REGISTRY_NS="$REGISTRY_NS" -e KASM_TAG="$KASM_TAG" -e NIX_PROFILES="" \
        -e NIX_BASE_AFFECTED="$NIX_BASE_AFFECTED" -e CI_COMMIT_SHA="$CI_COMMIT_SHA" \
        -e CI_PIPELINE_ID="$CI_PIPELINE_ID" -e CI_JOB_ID="$CI_JOB_ID" \
        -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
        -e REG="$CI_REGISTRY" -e REG_USER="$CI_REGISTRY_USER" -e REG_PASS="$CI_REGISTRY_PASSWORD" \
        "$DIND_IMG" bash -c '
          set -uo pipefail
          echo "$REG_PASS" | podman login "$REG" -u "$REG_USER" --password-stdin || exit 1
          DOCKER=podman bash /work/ci-scripts/nix-publish.sh; rc=$?
          # Always surface the report (even on partial push failure) before exiting.
          for f in nix-build-report.json nix-build-report.md; do
            cp "/root/.cache/nix-build-output/$f" "/artifacts/$f" 2>/dev/null || true
          done
          chown "${HOST_UID}:${HOST_GID}" /artifacts/nix-build-report.* 2>/dev/null || true
          echo "===== nix-build-report.md ====="; cat /artifacts/nix-build-report.md 2>/dev/null || true
          exit "$rc"
        '
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - nix-build-report.json
      - nix-build-report.md
  rules:
    - if: '$NIX_GC == "1"'      # GC-only schedule → don't publish
      when: never
    - if: '$NIX_UPDATE != ""'   # update pipelines only bump+push pins (BP-01)
      when: never
    - if: '$FORCE_PUBLISH == "1"'   # manual CLI publish (glab ci run) off any branch
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

# ── scan: Trivy CVE scan of the rebuilt Nix base/core images ────────────────
# Covers L1 (distro base) + L2 (KasmVNC / upload / squid / … Kasm core
# additions); /nix/store (L3) is NOT covered — Trivy has no nix analyzer, that
# needs Syft/vulnix (see design/cve-scanning.md). Report-only: JUnit → the
# pipeline Tests tab, plus a CVE table in the job log; findings never fail the
# job. Scoped to the bases that actually rebuilt this run (same NIX_BASES_REBUILD
# map as publish-base); scans nothing when no base changed. To baseline-scan all
# current bases without a rebuild, run a web pipeline with NIX_BASES set (the
# podman store is persistent, so the local :dev base images are already present).
scan-base:
  stage: scan
  needs: [base-check, base]
  rules:
    - if: '$NIX_GC == "1"'
      when: never
    - if: '$NIX_UPDATE != ""'   # update pipelines only bump+push pins (BP-01);
      when: never               # the pushed commit's own pipeline ships them
    - if: '$FORCE_PUBLISH == "1"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - |
      set -euo pipefail
      reb="${BASE_DISTROS:-${NIX_BASES_REBUILD:-}}"
      # Map rebuilt distro names → published base repo names, unless NIX_BASES was
      # set explicitly (manual override). Mirrors publish-base's mapping.
      if [ -z "${NIX_BASES:-}" ]; then
        filt=""
        for d in ${reb}; do case "$d" in
          ubuntu)   filt="${filt} kasm-core-ubuntu kasm-core-ubuntu-minimal" ;;
          fedora)   filt="${filt} kasm-core-fedora" ;;
          alpine)   filt="${filt} kasm-core-alpine" ;;
          resolute) filt="${filt} kasm-core-ubuntu-resolute" ;;
        esac; done
        NIX_BASES="$(printf '%s' "${filt}" | sed 's/^ *//;s/ *$//')"
      fi
      if [ -z "$(printf '%s' "${NIX_BASES}" | tr -d '[:space:]')" ]; then
        echo "no base rebuilt this run — nothing to scan"; exit 0
      fi
      echo "scanning rebuilt bases: ${NIX_BASES}"
      bash ci-scripts/dind-run.sh "nixci-${CI_JOB_NAME}-${CI_PIPELINE_ID}" \
        -v "$DIND_ROOT/containers:/var/lib/containers" \
        -v "$CI_PROJECT_DIR:/work:ro" \
        -v "$CI_PROJECT_DIR:/artifacts" \
        -e NIX_BASES="$NIX_BASES" -e S3_BUCKET="${S3_BUCKET:-}" \
        -e OUT_DIR=/artifacts -e DOCKER=podman \
        -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
        "$DIND_IMG" bash /work/ci-scripts/nix-scan-base.sh
  artifacts:
    when: always
    expire_in: 30 days
    reports:
      junit:
        - trivy-report-*.xml
    paths:
      - trivy-report-*.xml

# ── scan-nix: L3 (/nix/store) CVE scan — Syft→Grype + vulnix advisory ────────
# Report-only (design/cve-scanning.md § 7 step 3): findings never fail the job,
# scanner/infra errors do. Scans the changed apps (NIX_PROFILES dotenv; capped
# per-app on build-all runs) + the fat store from the persistent podman store.
# Emits gzipped CycloneDX SBOMs + Grype JSON + vulnix advisory JSON + a
# nix-scan-report.{json,md} summary with scanner/DB provenance.
scan-nix:
  stage: scan
  needs: [prepare, build]
  timeout: 2h
  rules:
    - if: '$NIX_GC == "1"'
      when: never
    - if: '$NIX_UPDATE != ""'   # update pipelines only bump+push pins (BP-01);
      when: never               # the pushed commit's own pipeline ships them
    - if: '$FORCE_PUBLISH == "1"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - |
      # Publish intent, NOT publication fact: scan-nix runs concurrently
      # with publish (needs: [prepare, build]) and always scans the local
      # candidate build — report rows are kind:candidate regardless. Intent
      # only controls the SBOM source-name (the intended registry ref, so
      # SBOMs attached post-push wear the name users pull) and the row's
      # intended_ref join key. MR pipelines scan pure candidates (publish
      # never runs for them) — their SBOMs must never carry the production
      # ref. Publication truth = nix-build-report.json's per-image mapping.
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        SBOM_PUBLISH_INTENT=0
      else
        SBOM_PUBLISH_INTENT=1
      fi
      bash ci-scripts/dind-run.sh "nixci-${CI_JOB_NAME}-${CI_PIPELINE_ID}" \
        -v "$DIND_ROOT/containers:/var/lib/containers" \
        -v "$DIND_ROOT/output:/build-output:ro" \
        -v "$CI_PROJECT_DIR:/work:ro" \
        -v "$CI_PROJECT_DIR:/artifacts" \
        -e NIX_PROFILES="$NIX_PROFILES" -e OUT_DIR=/artifacts -e DOCKER=podman \
        -e SCAN_MAX_APPS="${SCAN_MAX_APPS:-0}" -e SKIP_VULNIX="${SKIP_VULNIX:-0}" \
        -e SCAN_ALL="${SCAN_ALL:-0}" -e SKIP_FAT_SCAN="${SKIP_FAT_SCAN:-1}" \
        -e SBOM_PUBLISH_INTENT="$SBOM_PUBLISH_INTENT" \
        -e REGISTRY_NS="$REGISTRY_NS" -e KASM_TAG="$KASM_TAG" \
        -e CI_PIPELINE_ID="$CI_PIPELINE_ID" -e CI_JOB_ID="$CI_JOB_ID" \
        -e CI_PROJECT_PATH="$CI_PROJECT_PATH" \
        -e CI_COMMIT_SHA="$CI_COMMIT_SHA" \
        -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
        "$DIND_IMG" bash /work/ci-scripts/nix-scan-l3.sh
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - nix-scan-report.json
      - nix-scan-report.md
      - sboms/
      - grype/
      - vulnix/

# ── sbom-publish: attest + key-sign SBOMs on the images this run pushed ─────
# Build order step 4 (design/cve-scanning.md): end users verify with
#   cosign verify-attestation --key security/cosign.pub \
#     --insecure-ignore-tlog=true --type cyclonedx <ref> \
#     | jq -r '.payload' | base64 -d | jq '.predicate'     # the CycloneDX SBOM
#   cosign verify --key security/cosign.pub --insecure-ignore-tlog=true <ref>
# (in-toto attestation replaced the deprecated `cosign attach sbom`,
# 2026-07-19 — one signed DSSE artifact instead of attach+sign+sign,
# bounded-parallel via ATTEST_PARALLEL.)
# Consumes nix-build-report.json (publish) + sboms/ (scan-nix) artifacts.
# Signing key: COSIGN_PRIVATE_KEY / COSIGN_PASSWORD project CI variables.
# BACKFILL (initial rollout / key rotation): trigger a pipeline with
#   SBOM_BACKFILL=1 SCAN_ALL=1 NIX_EVAL_GATE=""
# The NIX_EVAL_GATE="" matters: dind-build prunes all localhost/nix-<app>:dev
# at build start, and a warm no-change build reassembles nothing — publish
# then reports only the fat store, so there is nothing to attach to
# (pipeline 2687556526). Gate off = every app reassembles = full coverage.
sbom-publish:
  stage: scan
  needs: [publish, scan-nix]
  rules:
    - if: '$NIX_GC == "1"'
      when: never
    - if: '$NIX_UPDATE != ""'   # update pipelines only bump+push pins (BP-01);
      when: never               # the pushed commit's own pipeline ships them
    - if: '$FORCE_PUBLISH == "1"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - |
      if [ "${NIX_PROFILES:-}" = "__none__" ]; then echo "nothing published — skipping"; exit 0; fi
      bash ci-scripts/dind-run.sh "nixci-${CI_JOB_NAME}-${CI_PIPELINE_ID}" \
        -v "$CI_PROJECT_DIR:/work:ro" \
        -v "$CI_PROJECT_DIR:/artifacts" \
        -e REG="$CI_REGISTRY" -e REG_USER="$CI_REGISTRY_USER" -e REG_PASS="$CI_REGISTRY_PASSWORD" \
        -e COSIGN_PRIVATE_KEY="$COSIGN_PRIVATE_KEY" -e COSIGN_PASSWORD="$COSIGN_PASSWORD" \
        -e SBOM_BACKFILL="${SBOM_BACKFILL:-0}" -e OUT_DIR=/artifacts \
        -e CI_COMMIT_SHA="$CI_COMMIT_SHA" -e CI_PIPELINE_ID="$CI_PIPELINE_ID" \
        -e CI_JOB_ID="$CI_JOB_ID" \
        -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
        "$DIND_IMG" bash /work/ci-scripts/nix-sbom-attach.sh
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - sbom-attach-report.md
      - sbom-attach-report.json

# ── security-page: refresh the registry site's security.json ────────────────
# Auto-updates https://kasm-nix-registry.emrul.dev/1.1/security.json after
# every successful scan+publish on the default branch. UPSERT semantics
# (ci-scripts/nix-security-page.py): change-gated pipelines merge just their
# scanned rows into the live file, so incremental runs (e.g. the twice-daily
# chrome schedule) refresh their rows without clobbering the catalog. The
# runner lives on the forge host, so the docroot is a local bind mount —
# writes go through sudo-nerdctl containers (the runner's sudo surface).
# Manual full regeneration stays in the registry repo (gen_security.py +
# deploy.sh), which now pulls the live file first so it can't clobber this.
security-page:
  stage: scan
  needs: [scan-nix, publish]
  rules:
    - if: '$NIX_GC == "1"'
      when: never
    - if: '$NIX_UPDATE != ""'   # update pipelines only bump+push pins (BP-01);
      when: never               # the pushed commit's own pipeline ships them
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - |
      # Change-gated no-op pipelines (NIX_PROFILES=__none__) skip scan-nix's
      # work — no report file means nothing scanned, nothing to publish.
      if [ ! -f nix-scan-report.json ]; then
        echo "no nix-scan-report.json this run — nothing scanned, skipping"; exit 0
      fi
      sudo nerdctl run --rm -v "$CI_PROJECT_DIR:/w" "$DIND_IMG" \
        python3 /w/ci-scripts/nix-security-page.py /w/nix-scan-report.json /w/security.json
      if [ -f security.json ]; then
        sudo nerdctl run --rm -v "$CI_PROJECT_DIR:/w:ro" \
          -v /srv/portal/kasm-nix-registry/1.1:/site \
          "$DIND_IMG" cp /w/security.json /site/security.json
        echo "security.json published to the registry docroot"
      else
        echo "nothing to publish (skip reason in the log above)"
      fi
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - security.json

# ── assess: BP-02/BP-03 assessment envelope — the remediator's input ─────────
# Fail-closed join of this pipeline's three machine reports (scan-nix rows +
# publish mappings + sbom-attach attestations) into ONE schema-versioned
# kasm-nix-assessment/v1 envelope. Release kind on publishing pipelines,
# candidate kind on MR pipelines (no publication claims). A missing report,
# an unmapped scan row, a config-digest mismatch, or a published occurrence
# without a verified attestation FAILS this job — after writing the truthful
# envelope. Findings never fail it (that's the remediator's business).
# skopeo (installed on demand) resolves existing .att digests for content-
# identical skips and the docker manifest-digest fallback.
assess:
  stage: test
  needs:
    - scan-nix
    - job: publish
      optional: true
    - job: sbom-publish
      optional: true
  rules:
    - if: '$NIX_GC == "1"'
      when: never
    - if: '$NIX_UPDATE != ""'   # update pipelines only bump+push pins (BP-01);
      when: never               # the pushed commit's own pipeline ships them
    - if: '$FORCE_PUBLISH == "1"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - |
      if [ ! -f nix-scan-report.json ]; then
        echo "nothing scanned this run — no assessment to produce"; exit 0
      fi
      sudo nerdctl run --rm -v "$CI_PROJECT_DIR:/w" \
        -e CI_COMMIT_SHA="$CI_COMMIT_SHA" -e CI_PROJECT_PATH="$CI_PROJECT_PATH" \
        -e CI_PIPELINE_ID="$CI_PIPELINE_ID" -e CI_JOB_ID="$CI_JOB_ID" \
        -e CI_PIPELINE_SOURCE="$CI_PIPELINE_SOURCE" \
        -e CI_COMMIT_BRANCH="${CI_COMMIT_BRANCH:-}" -e CI_DEFAULT_BRANCH="$CI_DEFAULT_BRANCH" \
        -e REG_USER="$CI_REGISTRY_USER" -e REG_PASS="$CI_REGISTRY_PASSWORD" \
        -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
        "$DIND_IMG" bash -c '
          set -uo pipefail
          command -v skopeo >/dev/null 2>&1 || dnf install -y -q skopeo >/dev/null 2>&1 || true
          python3 /w/ci-scripts/nix-assess.py --workdir /w --out /w/assessment.json; rc=$?
          chown "${HOST_UID}:${HOST_GID}" /w/assessment.json 2>/dev/null || true
          exit "$rc"
        '
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - assessment.json

# ── testbench: post-publish app assurance (downstream pipeline) ──────────────
# Fire-and-forget trigger of kasm-nix-testbench: it fetches this pipeline's
# nix-build-report.json (job-token allowlisted), spins up Kasm sessions for
# the changed apps on the .140 runner, and commits verdict reports to its own
# repo. Report-only in v1 — a red testbench pipeline does NOT fail this one
# (no strategy:depend); candidate→promote comes later.
testbench:
  stage: test
  needs: [publish]
  # a bridge that cannot even CREATE the downstream (e.g. its rules yield no
  # jobs) must not redden this pipeline — the testbench is report-only
  allow_failure: true
  rules:
    - if: '$NIX_GC == "1"'
      when: never
    - if: '$NIX_UPDATE != ""'   # update pipelines only bump+push pins (BP-01);
      when: never               # the pushed commit's own pipeline ships them
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  variables:
    UPSTREAM_PIPELINE_ID: $CI_PIPELINE_ID
  trigger:
    project: kasm-technologies/labs-sandbox/kasm-nix-testbench
    branch: main
