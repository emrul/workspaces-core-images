# ==========================================================================
# Kasm Nix app-image catalog — build & publish pipeline
# ==========================================================================
# Builds the deduped Nix store + one image per GUI app
# (build-nix-store-volume --emit-app-images) and publishes each under Kasm's
# naming convention as <REGISTRY_NS>/<kasm_name>:nix.
#
# Registry migration is one variable:
#   REGISTRY_NS = $CI_REGISTRY_IMAGE  → GitLab Container Registry (default, now)
#   REGISTRY_NS = docker.io/kasmweb   → Docker Hub kasmweb/<name>:nix (later)
#
# RUNNER: needs a self-hosted runner tagged `nix-builder` on a PERSISTENT host
# with `docker` (or podman) on PATH. Persistence is the whole caching strategy:
#   - the Nix store staging volume (nix-build-stage-<arch>) stays warm between
#     runs (Nix dedup → most reruns fetch nothing), and
#   - the local Docker layer cache keeps the core/nix-ubuntu base builds instant.
# A single builder is assumed (images built in `base` are reused locally by
# `apps`/`publish`). See docs/nix-ci.md for runner registration + config.
#
# The previous core-distro pipeline is preserved at ci-scripts/gitlab-ci-core.yml.
# ==========================================================================

variables:
  KASM_TAG: "nix"
  # Publish namespace. Defaults to this project's GitLab Container Registry.
  REGISTRY_NS: "$CI_REGISTRY_IMAGE"
  CORE_MINIMAL_IMG: "localhost/kasm-core-ubuntu-noble-minimal:dev"
  NIX_UBUNTU_IMG: "localhost/nix-ubuntu:dev"
  DOCKER_BUILDKIT: "1"
  GIT_SUBMODULE_STRATEGY: normal
  # Optional: restrict the app build to a subset, e.g. "onlyoffice vscode".
  # Empty = the whole catalog in nix-profiles.toml.
  NIX_PROFILES: ""

default:
  tags: [nix-builder]
  interruptible: true
  retry: 1

stages:
  - base
  - apps
  - publish

# ── base: core-minimal + nix-ubuntu (local Docker layer cache keeps this fast)
build-base:
  stage: base
  script:
    - |
      docker build \
        --build-arg BASE_IMAGE=ubuntu:24.04 \
        --build-arg DISTRO=ubuntu \
        --build-arg BG_IMG=bg_noble.png \
        -f dockerfile-kasm-core-minimal -t "$CORE_MINIMAL_IMG" .
    - |
      docker build \
        --build-arg BASE_IMAGE="$CORE_MINIMAL_IMG" \
        -f dockerfile-nix-ubuntu -t "$NIX_UBUNTU_IMG" .

# ── apps: deduped Nix store + one runnable image per GUI profile ────────────
# The warm nix-build-stage-<arch> volume on the runner host is the cache; a
# no-change rerun re-fetches almost nothing.
build-apps:
  stage: apps
  timeout: 3h
  script:
    - EXTRA=""; for p in $NIX_PROFILES; do EXTRA="$EXTRA --profile $p"; done
    - bin/build-nix-store-volume --emit-app-images --app-base-image "$NIX_UBUNTU_IMG" $EXTRA

# ── publish: tag kasm names + push ─────────────────────────────────────────
publish:
  stage: publish
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - bash ci-scripts/nix-publish.sh
  rules:
    # Publish from the default branch, or any pipeline started manually / via the
    # API (so you can cut a publish from a feature branch on demand).
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
